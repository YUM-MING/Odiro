[project]
name = "odiro"
version = "0.1.0"
description = "Odiro (어디로) - AI 국내 여행·데이트 코스 플래너"
requires-python = ">=3.11"
dependencies = [
    # LLM / Agent
    "langchain>=0.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-community>=0.3",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "tavily-python>=0.5",
    # UI
    "streamlit>=1.38",
    "streamlit-folium>=0.22",
    "folium>=0.17",
    # Data / infra
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "diskcache>=5.6",
    "astral>=3.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["odiro*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
